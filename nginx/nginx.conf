server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references hashed /assets/ files, so it must never be
    # cached — otherwise a browser can keep loading an old build after
    # a rebuild (this is what causes "my fix isn't showing up" bugs).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to the backend service in production/docker-compose.
    # Point VITE_API_BASE_URL at "/api/v1" and adjust the upstream below
    # once the Node.js REST backend is available.
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (React Router) resolve on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
