services:
  # Development: hot-reload dev server on http://localhost:5173
  # Default service — runs with a plain `docker compose up -d`.
  frontend:
    build:
      context: .
      target: development
    container_name: kaviya-erp-frontend
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev -- --host 0.0.0.0

  # Production: static build served by Nginx on http://localhost:8080
  # Opt-in: `docker compose --profile prod up -d nginx`
  nginx:
    build:
      context: .
      target: production
    container_name: kaviya-erp-nginx
    ports:
      - "8081:80"
    profiles: ["prod"]
